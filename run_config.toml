[common]
data_root = "data"
sample_users = 120
max_train_users = 80
max_eval_users = 40
use_moe_harness = false
moe_debug = false
moe_ranker_weight = 0.60
moe_baseline_weight = 0.25
moe_utility_weight = 0.15
moe_deposit_baseline_boost = 0.05
moe_fund_utility_boost = 0.10
moe_low_risk_fund_penalty = 0.15

[run_recommender]
family = "deposit"
fit = true
top_k = 5

[evaluate]
family = "deposit"
fit = true
ks = [5, 10]

[explain_recommender]
family = "deposit"
fit = true
top_k = 5
use_llm_renderer = false
llm_model = "gpt-5-mini"
llm_prompt_path = "src/explainer/explain.txt"
no_template_fallback = false
use_explainer_moe = true
explainer_moe_debug = false
compliance_rules_path = "src/explainer/compliance_rules.txt"

[improve_recommender_with_utility]
family = "deposit"
candidate_max = 80
ks = [5, 10]
out_dir = "reports/e2e/improved_recommender_deposit_cfg"
out_json = "reports/raw/e2e_improved_recommender_deposit_cfg.json"
fit_core_weights = [0.30, 0.25, 0.20, 0.15, 0.10]
dep_real_weights = [0.45, 0.25, 0.20, 0.10]
fund_real_weights = [0.40, 0.30, 0.20, 0.10]
hybrid_weights = [0.40, 0.35, 0.20, 0.05]
dep_label_weights = [0.35, 0.20, 0.20, 0.15, 0.10]
fund_label_weights = [0.35, 0.25, 0.15, 0.15, 0.10]
dep_item_weights = [0.45, 0.25, 0.20, 0.10]
fund_item_weights = [0.35, 0.25, 0.20, 0.10, 0.10]
fund_low_risk_penalty = 0.10
fund_gate_risk_min = 0.35
fund_gate_family_min = 0.50
normalize_utility_weights = true
tune_trials = 0
tune_seed = 42
tune_k = 5
tune_out_csv = "reports/raw/utility_tuning_trials.csv"
tune_item_only = false

[tps_main_v2]
csv_path = "data/thin_filer/신파일러_군집_최종_피처_통합.csv"
out_csv = "reports/e2e/신파일러_TPS_최종_산출_cfg.csv"

[evaluate_custom_v2]
csv_path = "data/thin_filer/신파일러_군집_최종_피처_통합.csv"
fit = true
ks = [5, 10]

[evaluate_explainer]
family = "all"
top_k = 5
fit = true
use_llm_renderer = false
llm_model = "gpt-5-mini"
llm_prompt_path = "src/explainer/explain.txt"
no_template_fallback = false
use_explainer_moe = true
explainer_moe_debug = false
compliance_rules_path = "src/explainer/compliance_rules.txt"
enable_understanding_eval = true
max_understanding_samples = 120
synthetic_repeat = 5
use_llm_user_simulator = false
use_llm_evaluator = false
simulator_model = "gpt-5-mini"
evaluator_model = "gpt-5-mini"
simulator_prompt_path = "src/explainer/simulator.txt"
evaluator_prompt_path = "src/explainer/evaluator.txt"
understanding_log_jsonl = "reports/e2e/explainer_understanding_logs.jsonl"

[benchmark_llm_models]
family = "all"
fit = true
top_k = 5
sample_users = 300
max_train_users = 200
max_eval_users = 80
models = ["gpt-5-mini", "gpt-5.4-mini", "gpt-5.4", "gpt-5.5"]
llm_prompt_path = "src/explainer/explain.txt"
no_template_fallback = true
use_explainer_moe = true
explainer_moe_debug = false
compliance_rules_path = "src/explainer/compliance_rules.txt"
llm_timeout_seconds = 45
llm_max_retries = 1
continue_on_error = true
enable_understanding_eval = true
max_understanding_samples = 120
synthetic_repeat = 5
use_llm_user_simulator = false
use_llm_evaluator = false
simulator_model = "gpt-5-mini"
evaluator_model = "gpt-5-mini"
simulator_prompt_path = "src/explainer/simulator.txt"
evaluator_prompt_path = "src/explainer/evaluator.txt"
disable_llm_quality_scoring = false
llm_quality_model = "auto"
llm_quality_timeout_seconds = 30
llm_quality_max_retries = 1
llm_quality_max_items = 40
out_dir = "reports/e2e/llm_model_benchmark"
